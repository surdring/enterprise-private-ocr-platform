# 企业私有 OCR 平台 Nginx 配置
# 宝塔面板: 放置于 /www/server/nginx/conf/vhost/ocr.conf
# 然后在 nginx.conf 的 http 块中添加: include /www/server/nginx/conf/vhost/ocr.conf;
# 或放入 /www/server/panel/vhost/nginx/ocr.conf (宝塔会自动加载)

server {
    listen 8001;  # 使用独立端口，避免与现有服务冲突
    server_name _;

    # 日志
    access_log /www/wwwlogs/ocr_access.log;
    error_log /www/wwwlogs/ocr_error.log;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # API 请求代理到 OCR 后端
    location /api/ {
        proxy_pass http://127.0.0.1:8012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置 (OCR 可能需要较长时间)
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # 文件上传大小限制 (需与后端 OCR_MAX_FILE_SIZE_BYTES 一致)
        client_max_body_size 50m;
    }

    # 健康检查端点
    location /api/health {
        proxy_pass http://127.0.0.1:8012/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 前端静态文件
    location / {
        root /home/zhengxueen/workspace/enterprise-private-ocr-platform/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}

